name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Dependencies are installed from uv.lock (uv sync --frozen), never resolved
# fresh from pyproject ranges. This keeps CI byte-identical to the local
# toolchain — a floating `pip install -e ".[dev]"` is what let newer
# crewai/fastapi/ruff releases break main without any code change.
# To upgrade dependencies: run `uv lock` locally, commit the lockfile.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run --frozen ruff check src/ tests/

      - name: Run ruff format check
        run: uv run --frozen ruff format --check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: uv run --frozen pytest tests/ -v --tb=short --cov=src/ad_buyer --cov-report=term-missing

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t ad-buyer-system:test .

      - name: Verify health check endpoint exists
        run: |
          docker run -d --name buyer-test -p 8001:8001 ad-buyer-system:test
          sleep 5
          docker logs buyer-test
          docker stop buyer-test
          docker rm buyer-test
