name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ad-buyer-system/${{ inputs.environment || 'staging' }}
  ECS_CLUSTER: ad-buyer-system-${{ inputs.environment || 'staging' }}-cluster
  ECS_SERVICE: ad-buyer-system-${{ inputs.environment || 'staging' }}-service

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # iab-agentic-primitives is public: the image build needs NO GitHub
          # token. Do not add a GH_PAT env var or BuildKit token secret here.
        run: |
          # No --secret mount: all git dependencies are public repositories.
          docker build \
            -f infra/docker/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment to stabilize
        run: |
          # `aws ecs wait services-stable` gives up after ~10 minutes (40 checks
          # x 15s), but this rollout routinely takes 9-11 minutes (ALB drain +
          # Fargate provisioning + health ramp), so the bare waiter reports
          # failure on deploys that succeed moments later. Poll the PRIMARY
          # deployment's rolloutState instead, with a 20-minute deadline.
          deadline=$(( $(date +%s) + 20 * 60 ))
          while true; do
            state=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[rolloutState,runningCount,desiredCount]' \
              --output text) || state=""
            rollout=$(echo "$state" | awk '{print $1}')
            running=$(echo "$state" | awk '{print $2}')
            desired=$(echo "$state" | awk '{print $3}')
            echo "$(date -u +%H:%M:%S) rolloutState=$rollout running/desired=$running/$desired"
            case "$rollout" in
              COMPLETED)
                echo "Deployment completed."
                exit 0
                ;;
              FAILED)
                echo "Deployment rollout FAILED." >&2
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after 20 minutes waiting for rollout to complete." >&2
              exit 1
            fi
            sleep 20
          done
